# tmux 配置：原生、无插件依赖
# 生效：tmux source-file ~/.config/tmux/tmux.conf

# ── 终端与缓冲 ────────────────────────────────────────────
set -g default-terminal "tmux-256color"
# 覆盖而非追加，避免每次 source 重复累积
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm*:RGB:clipboard,tmux*:RGB"
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g history-file ~/.cache/tmux/history
set -g set-clipboard on
set -g assume-paste-time 1

# ── 编号与布局 ────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g aggressive-resize on
set -g window-size latest
setw -g automatic-rename on
set -g allow-rename off
set -g detach-on-destroy off

# ── 交互习惯 ──────────────────────────────────────────────
set -g mouse on
setw -g mode-keys vi
set -g clock-mode-style 24
set -g display-time 2000
set -g set-titles on
set -g set-titles-string "#S:#I:#W"
set -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WSL_DISTRO_NAME WAYLAND_DISPLAY XDG_CURRENT_DESKTOP"

# ── 复制模式 ──────────────────────────────────────────────
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-c send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# macOS 用 pbcopy，其他平台用 xclip
if-shell 'uname -s | grep -q Darwin' \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"'

# ── 窗格 ──────────────────────────────────────────────────
bind "|" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind "\{" swap-pane -U
bind "\}" swap-pane -D
bind x kill-pane

# 免前缀：Option/Alt + 方向键切窗格
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ── 窗口与会话 ────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind Tab last-window
bind -r n next-window
bind -r p previous-window
bind -r M-n next-window
bind -r M-p previous-window

# 弹窗 shell，工作目录跟随当前窗格
bind g display-popup -E -d "#{pane_current_path}" -w 80% -h 80%
bind -n M-g display-popup -E -d "#{pane_current_path}" -w 80% -h 80%

# 浮窗模糊搜索窗口，避免 find-window 的状态栏输入框与窗口列表挤在一行
bind f display-popup -E -w 70% -h 50% -T " 切换窗口 " "fish ~/.config/tmux/popup-find.fish"
bind F command-prompt -p "查找窗口:" "find-window -Z '%%'"

# 重载配置
bind r source-file ~/.config/tmux/tmux.conf \; display-message "配置已重载"

# ── 外观（Nord） ──────────────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#2E3440,fg=#D8DEE9"
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#2E3440,bg=#{?client_prefix,#BF616A,#88C0D0},bold] #S #[default] "
set -g status-right "#[fg=#81A1C1] %m-%d %a %H:%M #[default]"
set -g window-status-format "#[fg=#D8DEE9,bg=#3B4252] #I #W#{?window_zoomed_flag,Z,} #{?window_activity_flag,●,} #[default]"
set -g window-status-current-format "#[fg=#2E3440,bg=#A3BE8C,bold] #I #W#{?window_zoomed_flag,Z,} #[default]"
set -g pane-border-style "fg=#434C5E"
set -g pane-active-border-style "fg=#88C0D0"
set -g message-style "bg=#434C5E,fg=#D8DEE9"
set -g message-command-style "bg=#434C5E,fg=#88C0D0"
set -g mode-style "bg=#5E81AC,fg=#ECEFF4"
set -g copy-mode-match-style "bg=#EBCB8B,fg=#2E3440"
set -g copy-mode-current-match-style "bg=#A3BE8C,fg=#2E3440"
